<svg width="100%" viewBox="0 0 800 510" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture du code d'ErPilot</title>
<desc>Le client appelle l'API REST, qui transmet la question au module core, chargé de l'orchestration. Le core s'appuie sur quatre modules : ragschema (recherche vectorielle du schéma), llm (génération SQL), security (validation sémantique et structurelle) et connector (exécution JDBC multi-dialecte, connecté à la base ERP). Le module common fournit les DTOs et exceptions partagés utilisés par l'ensemble des modules.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600}
.t{font-size:13px;font-weight:400}
.ts{font-size:11px;font-weight:400}
</style>

<!-- Client -->
<rect x="340" y="20" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="t" x="400" y="40" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Client</text>

<path d="M400 60 L400 90" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- api -->
<rect x="320" y="90" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="400" y="108" text-anchor="middle" fill="#26215C">api</text>
<text class="ts" x="400" y="124" text-anchor="middle" fill="#534AB7">POST /api/query</text>

<path d="M400 134 L400 170" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- core -->
<rect x="290" y="170" width="220" height="56" rx="10" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1"/>
<text class="th" x="400" y="192" text-anchor="middle" fill="#2C2C2A">core</text>
<text class="ts" x="400" y="209" text-anchor="middle" fill="#444441">orchestration de la requête</text>

<!-- Branches vers les 4 modules -->
<path d="M400 226 L400 245 L130 245 L130 270" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M400 226 L400 245 L310 245 L310 270" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M400 226 L400 245 L490 245 L490 270" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M400 226 L400 245 L670 245 L670 270" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ragschema -->
<rect x="50" y="270" width="160" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="130" y="291" text-anchor="middle" fill="#042C53">ragschema</text>
<text class="ts" x="130" y="308" text-anchor="middle" fill="#0F4A80">Recherche vectorielle</text>
<text class="ts" x="130" y="321" text-anchor="middle" fill="#0F4A80">du schéma (pgvector)</text>

<!-- llm -->
<rect x="230" y="270" width="160" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="310" y="291" text-anchor="middle" fill="#26215C">llm</text>
<text class="ts" x="310" y="308" text-anchor="middle" fill="#534AB7">Génération SQL</text>
<text class="ts" x="310" y="321" text-anchor="middle" fill="#534AB7">via le LLM</text>

<!-- security -->
<rect x="410" y="270" width="160" height="60" rx="8" fill="#FDEEEA" stroke="#B23A2E" stroke-width="0.5"/>
<text class="th" x="490" y="291" text-anchor="middle" fill="#5C1B14" >security</text>
<text class="ts" x="490" y="308" text-anchor="middle" fill="#8A2C22">Validation sémantique</text>
<text class="ts" x="490" y="321" text-anchor="middle" fill="#8A2C22">+ structurelle du SQL</text>

<!-- connector -->
<rect x="590" y="270" width="160" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="670" y="291" text-anchor="middle" fill="#04342C">connector</text>
<text class="ts" x="670" y="308" text-anchor="middle" fill="#0F6E56">Exécution JDBC</text>
<text class="ts" x="670" y="321" text-anchor="middle" fill="#0F6E56">multi-dialecte</text>

<path d="M670 330 L670 360" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Base ERP -->
<rect x="590" y="360" width="160" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="670" y="380" text-anchor="middle" dominant-baseline="central" fill="#04342C">Base de données</text>
<text class="ts" x="670" y="396" text-anchor="middle" fill="#0F6E56">de l'ERP</text>

<!-- common -->
<rect x="20" y="440" width="760" height="50" rx="10" fill="#F5F4F0" stroke="#8A8A85" stroke-width="1" stroke-dasharray="4 3"/>
<text class="th" x="400" y="460" text-anchor="middle" fill="#5F5E5A">common</text>
<text class="ts" x="400" y="477" text-anchor="middle" fill="#7A7A75">DTOs et exceptions partagés — utilisé par tous les modules ci-dessus</text>

</svg>
