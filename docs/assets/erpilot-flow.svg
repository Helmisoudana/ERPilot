<svg width="100%" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fonctionnement interne d'ErPilot</title>
<desc>La question en langage naturel passe par une recherche RAG du schéma, une génération SQL par LLM, une validation de sécurité, une exécution, avec une boucle de correction automatique en cas d'erreur, avant de renvoyer le résultat.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;font-weight:400}
</style>

<!-- Step 1: Question -->
<rect x="180" y="20" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="290" y="38" text-anchor="middle" fill="#2C2C2A">Question</text>
<text class="ts" x="290" y="56" text-anchor="middle" fill="#444441">En langage naturel</text>

<line x1="290" y1="76" x2="290" y2="136" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Step 2: RAG -->
<rect x="180" y="136" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="290" y="154" text-anchor="middle" fill="#04342C">Recherche RAG</text>
<text class="ts" x="290" y="172" text-anchor="middle" fill="#0F6E56">Tables pertinentes</text>

<line x1="290" y1="192" x2="290" y2="252" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Step 3: Génération SQL -->
<rect x="180" y="252" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="290" y="270" text-anchor="middle" fill="#26215C">Génération SQL</text>
<text class="ts" x="290" y="288" text-anchor="middle" fill="#534AB7">Via le LLM (Ollama)</text>

<line x1="290" y1="308" x2="290" y2="368" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Step 4: Validation sécurité -->
<rect x="180" y="368" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="290" y="386" text-anchor="middle" fill="#4A1B0C">Validation sécurité</text>
<text class="ts" x="290" y="404" text-anchor="middle" fill="#993C1D">Tables réelles + règles</text>

<line x1="290" y1="424" x2="290" y2="484" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Step 5: Exécution SQL -->
<rect x="180" y="484" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="290" y="502" text-anchor="middle" fill="#04342C">Exécution SQL</text>
<text class="ts" x="290" y="520" text-anchor="middle" fill="#0F6E56">Sur la base ERP</text>

<line x1="290" y1="540" x2="290" y2="600" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Step 6: Résultat -->
<rect x="180" y="600" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="290" y="618" text-anchor="middle" fill="#2C2C2A">Résultat</text>
<text class="ts" x="290" y="636" text-anchor="middle" fill="#444441">Retour à l'utilisateur</text>

<!-- Feedback loop: erreur SQL -> correction -->
<path d="M400 512 L430 512 L430 280 L400 280" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text class="ts" x="438" y="392" fill="#993C1D">Erreur SQL</text>
<text class="ts" x="438" y="408" fill="#993C1D">correction auto (≤2x)</text>

</svg>
